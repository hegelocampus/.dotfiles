- clean: ['~']
- defaults:
    link:
      create: true
      force: true
- link:
    ~/.profile:
    ~/.bash_profile:
    ~/.bashrc:
    ~/.bashbee:
    ~/.bash_logout:
    ~/.gitconfig:
    ~/.Xmodmap:
    ~/.Xresources:
    ~/.xinitrc:
    ~/.xprofile:
    ~/.zshrc: zsh/zshrc
    ~/.zshenv: zsh/zshenv
    ~/.vimrc:
        path:  vim/vimrc
    ~/.taskrc: config/taskrc
    ~/.i3/config: config/i3
    ~/.config/redshift.conf: config/redshift
    ~/.config/i3status/config/i3status.conf: config/i3status
    ~/.config/kitty/kitty.conf: config/kitty
    ~/.config/ranger/rc.conf: config/ranger
    ~/.config/rofi/config: config/rofi
    ~/.config/compton.conf: config/compton-blur
    ~/.config/dunst/dunstrc: config/dunstrc
    ~/.claude/CLAUDE.md: claude/CLAUDE.md
    ~/.claude/settings.json: claude/settings.json
    ~/.claude/askpass.sh: claude/askpass.sh
- shell:
  - [git submodule update --init --recursive, Installing submodules]
  - command: sudo ln -sfn "$(pwd)/etc/greetd/config.toml" /etc/greetd/config.toml
    description: Linking greetd config (requires sudo)
    stdin: true
    stdout: true
    stderr: true
  # Copied rather than linked: tuigreet runs as the unprivileged `greeter` user,
  # which cannot traverse $HOME to follow a symlink into this repo.
  - command: sudo install -Dm644 "$(pwd)/etc/tuigreet/config.toml" /etc/tuigreet/config.toml
    description: Installing tuigreet config (requires sudo)
    stdin: true
    stdout: true
    stderr: true
